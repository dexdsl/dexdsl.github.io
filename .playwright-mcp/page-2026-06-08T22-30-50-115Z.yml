                - text: Improviser, composer, and interpreter Tim Feeney seeks to explore and examine the possibilities inherent in unstable sound and duration. Tim began working in this thread in 2002, within Boston’s community of improvisers interested in austere combinations of sounds and silences, and has since performed and recorded with musicians throughout the United States and abroad. He frequently collaborates with artists including the trio Meridian, with percussionists Sarah Hennies and Greg Stuart, pianist Annie Lewandowski, cellist and electronic musician Vic Rawlings, vocalist Ken Ueno, saxophonist Andrew Raffo Dewar, banjo and electronic musician Holland Hopson, trumpeter Nate Wooley, sound artists Jed Speare and Ernst Karel, video artist Jane Cassidy, and many others. Visit Tim Feeney’s website at timfeeney.com
