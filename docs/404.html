<!doctype html>
<html lang="en-US">
  <head>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8ebf1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
    <title>Page not found — Dex</title>
    <script>
      (function () {
        var p = location.pathname || '/';
        var isPublicProfile = /^\/u\/[^/.][^/]*\/?$/i.test(p);
        
        // Load stylesheets for ALL 404 pages
        [
          '/css/tokens.css',
          '/css/base.css',
          '/css/bridge.squarespace.css',
          '/css/components/dx-layout.css',
          '/css/components/dx-surface.css',
          '/css/components/dx-controls.css',
          '/css/components/dx-nav.css',
          '/css/components/dx-profile-public.css',
          '/css/fonts.css',
          '/assets/css/dex.css'
        ].forEach(function (href) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = href;
          document.head.appendChild(link);
        });
        
        if (isPublicProfile) {
          document.documentElement.setAttribute('data-dx-profile-fallback', 'true');
          document.title = 'Member profile - dex digital sample library';
          return;
        }

        // if no extension and no trailing slash, try adding slash
        if (!p.endsWith("/") && p.split("/").pop().indexOf(".") === -1) {
          location.replace(p + "/" + location.search + location.hash);
        }
      })();
    </script>
  <script defer src="/assets/dex-runtime-config.js"></script>
<script defer src="/assets/js/dx-favorites.js"></script>
<script defer src="/assets/js/header-slot.js"></script>
<script defer src="/assets/js/dx-scroll-dot.js"></script>
<script defer src="/assets/js/interactive-hover.js"></script>
<script defer src="/assets/js/dx-pagenav.js"></script>
</head>
  <body>
    <script>
      (function () {
        var isProfileFallback = document.documentElement.getAttribute('data-dx-profile-fallback') === 'true';
        
        if (isProfileFallback) {
          document.body.innerHTML = [
            '<main id="page" class="dx-utility-wrap" tabindex="-1">',
            '  <section id="dex-profile" data-dx-fetch-state="loading" aria-busy="true">',
            '    <div class="dx-route-loader" data-dx-route-loader role="status" aria-live="polite">',
            '      <div class="dx-route-loader-inner">',
            '        <div class="dx-route-loader-meta">',
            '          <span class="dx-route-loader-phase">Loading</span>',
            '          <span class="dx-route-loader-detail">member profile</span>',
            '        </div>',
            '        <div class="dx-route-loader-track"><span class="dx-route-loader-fill"></span></div>',
            '      </div>',
            '    </div>',
            '  </section>',
            '</main>'
          ].join('');
        } else {
          // Enhanced 404 content (utility-first, mildly playful)
          var attempted = (location.pathname || '/') + (location.search || '') + (location.hash || '');
          document.title = '404 — Page not found';
          document.body.innerHTML = [
            '<main id="page" class="dx-utility-wrap" tabindex="-1">',
            '  <section class="dx-404-section">',
            '    <div class="dx-404-inner">',
            '      <div class="dx-404-panel">',
            '        <div class="dx-404-code" aria-hidden="true">404</div>',
            '        <h1 class="dx-404-title">We can\'t find that page</h1>',
            '        <p class="dx-404-desc">Looks like this packet went missing. You tried: <code id="dx-404-path">' + attempted.replace(/</g, '&lt;') + '</code></p>',
            '        <div class="dx-404-actions" id="dx-404-cta-mount">',
            '          <a href="/" class="dx-button-element dx-button-element--primary">Go Home</a>',
            '          <a href="/dexnotes/" class="dx-button-element dx-button-element--secondary">Browse Dexnotes</a>',
            '          <a href="/catalog/" class="dx-button-element dx-button-element--secondary">Catalog</a>',
            '          <a href="/polls" class="dx-button-element dx-button-element--secondary">Polls</a>',
            '          <a href="/contact/" class="dx-button-element dx-button-element--secondary">Contact</a>',
            '        </div>',
            '        <p class="dx-404-suggest" id="dx-404-suggest" aria-live="polite"></p>',
            '  </section>',
            '</main>',
          ].join('');
        }
        
        [
          '/assets/dex-runtime-config.js',
          '/assets/dex-auth0-config.js',
          '/assets/dex-auth.js',
          '/assets/js/header-slot.js?v=20260628a',
          '/assets/js/dx-scroll-dot.js',
          '/assets/js/interactive-hover.js',
          '/assets/js/profile.public.js'
        ].forEach(function (src) {
          var script = document.createElement('script');
          script.src = src;
          script.async = false;
          document.body.appendChild(script);
        });

        // Achievements integrations:
        // - Grant the regular 404 achievement (found-404) for signed-in users on any 404 visit.
        // - Inject a visible CTA on the specific /808 route that, when clicked, attempts to claim the secret '808-easter-egg' and then navigates to the achievements page.
        (function () {
          try {
            var pathNorm = (location.pathname || '/').replace(/\/+$/,'') || '/';

            function claimBadgeIfAuthenticated(badgeId) {
              try {
                if (!window.DEX_AUTH || typeof window.DEX_AUTH.ready === 'undefined') return;
                window.DEX_AUTH.ready.then(function () {
                  if (typeof window.DEX_AUTH.isAuthenticated !== 'function') return;
                  window.DEX_AUTH.isAuthenticated().then(function (isAuth) {
                    if (!isAuth) return;
                    try {
                      window.DEX_AUTH.getAccessToken().then(function (token) {
                        if (!token) return;
                        var reqId = 'achv-claim-' + badgeId + '-' + Date.now() + '-' + Math.random().toString(16).slice(2,8);
                        // attempt to POST claim; server behavior may accept secret-claim for recorded unlocks
                        fetch('/me/achievements/secret-claim', {
                          method: 'POST',
                          credentials: 'same-origin',
                          headers: {
                            'Authorization': 'Bearer ' + token,
                            'Content-Type': 'application/json',
                            'x-dx-request-id': reqId
                          },
                          body: JSON.stringify({ claim: badgeId, badgeId: badgeId, clientRequestId: reqId })
                        }).catch(function () { /* ignore errors */ });
                      }).catch(function(){/*ignore*/});
                    } catch (e) { /* ignore */ }
                  }).catch(function(){});
                }).catch(function(){});
              } catch (e) { /* ignore */ }
            }

            // grant regular 404 achievement (non-secret) when signed-in
            claimBadgeIfAuthenticated('found-404');

            // inject CTA on /808 for secret claim (visible to all)
            if (pathNorm === '/808') {
              var mount = document.getElementById('dx-404-cta-mount');
              if (mount) {
                var secretBtn = document.createElement('a');
                secretBtn.href = '/entry/achievements/';
                secretBtn.id = 'dx-808-achv-cta';
                secretBtn.className = 'dx-button-element dx-button-element--primary dx-button-size--md';
                secretBtn.textContent = 'Open Achievements';
                secretBtn.style.marginLeft = '8px';
                mount.appendChild(secretBtn);

                secretBtn.addEventListener('click', function (ev) {
                  ev.preventDefault();
                  // Try to claim secret if we have auth token; otherwise navigate and let guard handle sign-in.
                  (function () {
                    try {
                      if (!window.DEX_AUTH || typeof window.DEX_AUTH.ready === 'undefined') { location.assign('/entry/achievements/'); return; }
                      window.DEX_AUTH.ready.then(function () {
                        var isAuth = typeof window.DEX_AUTH.isAuthenticated === 'function' ? window.DEX_AUTH.isAuthenticated() : Promise.resolve(false);
                        isAuth.then(function (auth) {
                          if (!auth) { location.assign('/entry/achievements/'); return; }
                          // get token and POST claim
                          window.DEX_AUTH.getAccessToken().then(function (token) {
                            if (!token) { location.assign('/entry/achievements/'); return; }
                            var reqId = '808-claim-' + Date.now() + '-' + Math.random().toString(16).slice(2,8);
                            fetch('/me/achievements/secret-claim', {
                              method: 'POST',
                              credentials: 'same-origin',
                              headers: {
                                'Authorization': 'Bearer ' + token,
                                'Content-Type': 'application/json',
                                'x-dx-request-id': reqId
                              },
                              body: JSON.stringify({ claim: '808-easter-egg', badgeId: '808-easter-egg', clientRequestId: reqId })
                            }).catch(function(){/*ignore*/}).finally(function(){ location.assign('/entry/achievements/'); });
                          }).catch(function(){ location.assign('/entry/achievements/'); });
                        }).catch(function(){ location.assign('/entry/achievements/'); });
                      }).catch(function(){ location.assign('/entry/achievements/'); });
                    } catch (e) { location.assign('/entry/achievements/'); }
                  })();
                }, { passive: true });
              }
            }
          } catch (e) { /* ignore */ }
        })();

      })();
    </script>
  </body>
</html>
