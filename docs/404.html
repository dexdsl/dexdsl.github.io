    <script>
      (function () {
        var path = location.pathname || "/";
        var isPublicProfile = /^\/u\/[^/.][^/]*\/?$/i.test(path);
        if (isPublicProfile) {
          var profileStyles = document.createElement("link");
          profileStyles.rel = "stylesheet";
          profileStyles.href = "/css/components/dx-profile-public.css";
          document.head.appendChild(profileStyles);
          var profileRuntime = document.createElement("script");
          profileRuntime.src = "/assets/js/profile.public.js";
          profileRuntime.defer = true;
          document.head.appendChild(profileRuntime);
          document.documentElement.setAttribute("data-dx-profile-fallback", "true");
          document.title = "Member profile — Dex";
          return;
        }
        if (!path.endsWith("/") && path.split("/").pop().indexOf(".") === -1) {
          location.replace(path + "/" + location.search + location.hash);
        }
      })();
    </script>
    <script defer src="/assets/vendor/auth0-spa-js.umd.min.js"></script>
    <script defer src="/assets/dex-auth0-config.js"></script>
    <script defer src="/assets/dex-runtime-config.js"></script>

</head>
  <body>
    <main id="page" class="dx-not-found-page" tabindex="-1">
      <section id="dex-not-found" class="dx-not-found" data-dx-not-found-mode="standard">
        <div class="dx-not-found-surface">
          <div class="dx-not-found-copy">
            <p class="dx-not-found-kicker">Error 404 · Route not found</p>
            <h1 class="dx-not-found-title" data-dx-not-found-title data-dx-heading-randomize="false">Page not found.</h1>
            <p class="dx-not-found-summary" data-dx-not-found-summary>
              The address may have moved, changed, or never existed.
            </p>
            <p class="dx-not-found-attempt">
              <span>You tried</span>
              <code data-dx-not-found-path>/missing/</code>
            </p>
            <p class="dx-not-found-suggestion" data-dx-not-found-suggestion hidden>
              Did you mean
              <a href="/" data-dx-not-found-suggestion-link>Home</a>?
            </p>
            <div class="dx-not-found-actions" aria-label="404 recovery actions">
              <a href="/" class="dx-button-element dx-button-element--primary dx-button-size--md">Go home</a>
              <button
                type="button"
                class="dx-button-element dx-button-element--secondary dx-button-size--md"
                data-dx-not-found-back
                hidden
              >Go back</button>
              <a href="/catalog/" class="dx-button-element dx-button-element--secondary dx-button-size--md">Browse catalog</a>
              <a href="/dexnotes/" class="dx-not-found-text-link">Read Dex Notes</a>
              <button
                type="button"
                class="dx-button-element dx-button-element--primary dx-button-size--md dx-not-found-achievements"
                data-dx-808-achievements
                hidden
              >Achievements</button>
            </div>
            <p class="dx-not-found-feedback" data-dx-not-found-feedback role="status" aria-live="polite"></p>
          </div>

          <div class="dx-not-found-visual" aria-hidden="true">
            <span class="dx-not-found-code">404</span>
            <span class="dx-not-found-index">DEX / LOST ROUTE / 04</span>
            <span class="dx-not-found-cut"></span>
          </div>

        </div>
      </section>

      <section id="dex-profile" class="dx-profile-fallback" data-dx-fetch-state="loading" aria-busy="true">
        <div class="dx-route-loader" data-dx-route-loader role="status" aria-live="polite">
          <div class="dx-route-loader-inner">
            <div class="dx-route-loader-meta">
              <span class="dx-route-loader-phase">Loading</span>
              <span class="dx-route-loader-detail">member profile</span>
            </div>
            <div class="dx-route-loader-track"><span class="dx-route-loader-fill"></span></div>
          </div>
        </div>
      </section>
    </main>
  </body>
